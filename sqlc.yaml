version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/store/queries
    gen:
      go:
        package: store
        out: internal/store
        sql_package: pgx/v5
        output_db_file_name: queries_db.go
        output_models_file_name: queries_models.go
        emit_json_tags: true
        overrides:
          - db_type: pg_catalog.numeric
            nullable: true
            go_type: { type: float64, pointer: true }
          - db_type: timestamptz
            go_type: time.Time
          - db_type: text
            nullable: true
            go_type: { type: string, pointer: true }
          - db_type: pg_catalog.bpchar
            nullable: true
            go_type: { type: string, pointer: true }
          - db_type: pg_catalog.bool
            nullable: true
            go_type: { type: bool, pointer: true }
          - db_type: jsonb
            go_type: encoding/json.RawMessage
          - db_type: jsonb
            nullable: true
            go_type: encoding/json.RawMessage
          - db_type: pg_catalog.int4
            nullable: true
            go_type: { type: int32, pointer: true }
          - db_type: pg_catalog.int8
            nullable: true
            go_type: { type: int64, pointer: true }
          - db_type: timestamptz
            nullable: true
            go_type: { type: time.Time, pointer: true }
