name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod  # honours the `toolchain` line
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          [ -z "$unformatted" ] || { echo "not gofmt'ed:"; echo "$unformatted"; exit 1; }
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
      - name: go test (database tests use Docker via testcontainers)
        run: go test -race ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: backend image
        run: docker build -t jobradar-backend:ci .
      - name: healthcheck fails cleanly with no server
        run: |
          if docker run --rm jobradar-backend:ci healthcheck; then exit 1; fi
      - name: mlflow image
        run: docker build -t jobradar-mlflow:ci deploy/mlflow
